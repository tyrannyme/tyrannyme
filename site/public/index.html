<style>
:root{color-scheme:light dark;--paper:#faf7f2;--ink:#1f1e2a;--soft:#55536a;--rule:#e7e1d8;--accent:#c8642e;--glow:#efe3ef,#f6e7da 45%}
@media (prefers-color-scheme:dark){:root{--paper:#18171f;--ink:#efebe4;--soft:#b2aebf;--rule:#2c2a36;--accent:#f0a274;--glow:#2f2a48,#2a2230 50%}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-size-adjust:100%}
a{color:inherit}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
svg,img{display:block}
header{padding:52px 16px 8px;background:radial-gradient(60% 90% at 50% 0%,var(--glow),transparent);text-align:center}
.crown{width:119px;height:107px;margin:0 auto 14px;filter:drop-shadow(0 12px 14px rgb(31 30 42/.14))}
h1{margin:0}
.wordmark{width:150px;height:43px;margin:0 auto}
main,footer{width:min(472px,100% - 48px);margin:0 auto}
ul{margin:0;padding:36px 0 12px;list-style:none}
li{display:grid;grid-template-columns:56px 1fr;gap:18px;align-items:start;padding:20px 0}
li+li{border-top:1px solid var(--rule)}
.icon{width:56px;height:56px;overflow:hidden;border-radius:14px;box-shadow:0 1px 2px rgb(0 0 0/.06),0 6px 16px -8px rgb(31 30 42/.35)}
.icon svg,.icon img{width:100%;height:100%}
h2{margin:0;font-size:18px;font-weight:600;line-height:1.3}
li p{margin:2px 0 8px;color:var(--soft)}
li .links{margin:0;font-size:15px}
.links a{text-decoration:underline 1.5px var(--accent);text-underline-offset:4px}
.links a+a{margin-left:18px}
footer{display:flex;justify-content:space-between;align-items:center;padding:12px 0 28px;border-top:1px solid var(--rule);color:var(--soft)}
.motto{width:117px;height:16px;color:var(--ink)}
.social{display:flex;gap:6px;margin:0 -8px 0 0}
.social a{display:grid;place-items:center;width:36px;height:36px;border-radius:8px}
.social a:hover{color:var(--ink)}
@media (max-width:480px){header{padding-top:40px}.crown{width:92px;height:83px;margin-bottom:10px}.wordmark{width:124px;height:36px}main,footer{width:calc(100% - 32px)}ul{padding-top:24px}li{grid-template-columns:48px 1fr;gap:14px;padding:16px 0}.icon{width:48px;height:48px;border-radius:12px}}
</style>
